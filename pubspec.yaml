name: playground_bloc
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  dartz: ^0.10.1
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  json_serializable: ^6.11.1
  sqflite: ^2.4.2
  path: ^1.8.3
  freezed: ^3.2.3
  freezed_annotation: any
  flutter_svg: ^2.0.17
  dotted_border: ^2.1.0
  image_picker: ^1.2.0
  camera: ^0.11.2
  permission_handler: ^12.0.1
  path_provider: ^2.1.3
  melos: ^6.3.3
  history:
    path: packages/history

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9
  test: ^1.25.8
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
  - assets/icons/
